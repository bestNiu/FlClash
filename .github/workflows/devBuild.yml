name: devbuild-lite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest

          - platform: windows
            os: windows-2022
            arch: amd64

          - platform: linux
            os: ubuntu-22.04
            arch: amd64

          - platform: macos
            os: macos-15-intel
            arch: amd64

          - platform: macos
            os: macos-latest
            arch: arm64

          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter (stable)
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04-arm') }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Setup Flutter (arm64 / master)
        if: ${{ startsWith(matrix.os, 'ubuntu-24.04-arm') }}
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.35.7'
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      # -------------------------
      # Android (release + signing)
      # -------------------------
      - name: Setup Android signing (release)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android (release apk)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk --release
          mkdir -p dist
          cp -f build/app/outputs/flutter-apk/app-release.apk dist/

      # -------------------------
      # Windows (release)
      # -------------------------
      - name: Build Windows (release)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter build windows --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build\windows\x64\runner\Release\*" "dist\"

      # -------------------------
      # macOS (release)
      # -------------------------
      - name: Build macOS (release)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          flutter build macos --release
          mkdir -p dist
          cp -R "build/macos/Build/Products/Release/"*.app dist/

      # -------------------------
      # Linux (release)
      # -------------------------
      - name: Build Linux (release)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          flutter build linux --release
          mkdir -p dist
          # 不同 flutter 版本/架构 bundle 路径会有差异，用 find 更稳
          bundle_dir="$(find build/linux -type d -name bundle -maxdepth 8 | head -n 1 || true)"
          if [ -z "$bundle_dir" ]; then
            echo "Linux bundle dir not found under build/linux"
            find build/linux -maxdepth 6 -type d -print || true
            exit 1
          fi
          cp -r "$bundle_dir/"* dist/

      # -------------------------
      # Debug: show dist contents
      # -------------------------
      - name: Show dist contents
        shell: bash
        run: |
          echo "=== dist (after build) ==="
          ls -la dist || true
          echo "=== dist tree ==="
          find dist -maxdepth 2 -type f -print || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flclash-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ./dist
          overwrite: true
          if-no-files-found: error
