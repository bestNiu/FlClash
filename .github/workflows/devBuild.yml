name: devbuild-lite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest

          - platform: windows
            os: windows-2022
            arch: amd64

          - platform: linux
            os: ubuntu-22.04
            arch: amd64

          - platform: macos
            os: macos-15-intel
            arch: amd64

          - platform: macos
            os: macos-latest
            arch: arm64

          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Rust (Windows only)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter (stable)
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04-arm') }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Setup Flutter (arm64 / master)
        if: ${{ startsWith(matrix.os, 'ubuntu-24.04-arm') }}
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.35.7'
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      # ✅ Android：准备签名文件（release 必需）
      - name: Setup Android signing (release)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > android/app/keystore.jks

          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # ✅ Android：直接 flutter build release，稳定输出产物
      - name: Build (android release apk)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk --release --dart-define=APP_ENV=stable
          mkdir -p dist
          cp -f build/app/outputs/flutter-apk/app-release.apk dist/

      # ✅ 其他平台（非 Android）：走 setup.dart 完整构建
      - name: Build (non-android)
        if: matrix.platform != 'android'
        run: |
          dart setup.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} --env stable
      
      # （可选但强烈推荐）打印 dist，方便你确认确实有产物
      - name: Show dist
        shell: bash
        run: |
          echo "=== dist ==="
          ls -la dist || true
          find dist -maxdepth 2 -type f -print || true


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flclash-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ./dist
          overwrite: true
